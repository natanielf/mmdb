[package]
name = "mmdb"
version = "0.1.0"
edition = "2021"
description = "A small multimodal catalog and retrieval engine for image and audio files"

[dependencies]
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
